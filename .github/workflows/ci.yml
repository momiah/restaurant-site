name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Website
        run: |
          npm ci --no-audit --no-fund
          CI=true npm test -- --watchAll=false
      - name: Functions
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test

  rules:
    name: Rules tests (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('rules-tests/package-lock.json') }}
      - run: npm ci --no-audit --no-fund --prefix functions
      - run: npm ci --no-audit --no-fund --prefix rules-tests
      - run: npm test --prefix rules-tests

  e2e:
    name: Website journeys (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: suite
        run: echo "present=${{ hashFiles('e2e/package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.suite.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            e2e/package-lock.json
      - if: steps.suite.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.suite.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install
        if: steps.suite.outputs.present == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix functions
          npm ci --no-audit --no-fund --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium
      - name: Run journeys
        if: steps.suite.outputs.present == 'true'
        run: npm run e2e
      - name: Upload Playwright report
        if: failure() && steps.suite.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
      - if: steps.suite.outputs.present != 'true'
        run: echo "No e2e/ suite on this branch yet; skipping the journeys."
